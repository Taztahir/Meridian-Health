<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="cross" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ccfbf1" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>

  <!-- Subtle inner highlight -->
  <rect width="64" height="64" rx="16" fill="white" fill-opacity="0.06"/>

  <!-- Medical cross symbol -->
  <!-- Horizontal bar -->
  <rect x="14" y="24" width="36" height="10" rx="3" fill="url(#cross)"/>
  <!-- Vertical bar -->
  <rect x="27" y="14" width="10" height="36" rx="3" fill="url(#cross)"/>

  <!-- Heartbeat line overlaid on the cross -->
  <polyline
    points="14,34 21,34 24,28 27,40 30,29 33,39 37,34 50,34"
    stroke="#0f766e"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    opacity="0.55"
  />
</svg>